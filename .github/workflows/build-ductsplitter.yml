name: Build TD.DuctSplitter

on:
  push:
    paths: [ "DuctSplitter/**", ".github/workflows/build-ductsplitter.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: [ 2022, 2023, 2024, 2025, 2026, 2027 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build DuctSplitter/DuctSplitter.csproj -c Release -p:RevitVersion=${{ matrix.revit }}
      - name: Package
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.revit }}"
          New-Item -ItemType Directory -Force "$out/TD.DuctSplitter" | Out-Null
          Copy-Item "DuctSplitter/bin/Release/Revit${{ matrix.revit }}/TD.DuctSplitter.dll" "$out/TD.DuctSplitter/"
          Copy-Item "DuctSplitter/TD.DuctSplitter.addin" "$out/"
      - uses: actions/upload-artifact@v4
        with:
          name: TD.DuctSplitter-Revit${{ matrix.revit }}
          path: dist/${{ matrix.revit }}
